name: Daily SEO Blogs

on:
  schedule:
    # 06:00 UTC ≈ 08:00 Paris (été). Ajuster selon la saison / le fuseau voulu.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write # nécessaire pour committer les boutiques/*/etat.json

concurrency:
  group: daily-seo
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run bot
        run: node src/index.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STORES_SECRETS: ${{ secrets.STORES_SECRETS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Images : "ai" = génération OpenAI (gpt-image-1) · "stock" = Pexels/Unsplash. Qualité : low|medium|high.
          IMAGE_MODE: "ai"
          IMAGE_QUALITY: "medium"
          COMMIT_STATE: "1"
          # "1" = publie en BROUILLON · "0" = publie en PUBLIC. (Repasser à "1" pour revenir en brouillon.)
          FORCE_DRAFT: "0"
